<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Icon Generator</title></head>
<body style="background:#222;display:flex;flex-direction:column;align-items:center;padding:40px;gap:20px">
  <svg id="logo" width="1024" height="1024" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
    <rect width="50" height="50" rx="11" fill="#1B2D4F"/>
    <circle cx="22" cy="25" r="15" fill="#FFFDF6"/>
    <circle cx="31" cy="21" r="14" fill="#1B2D4F"/>
    <path d="M 40 11 L 41.2 14 L 44.2 15.2 L 41.2 16.4 L 40 19.4 L 38.8 16.4 L 35.8 15.2 L 38.8 14 Z" fill="#FFFDF6"/>
    <path d="M 37 36 L 37.8 38 L 39.8 38.8 L 37.8 39.6 L 37 41.6 L 36.2 39.6 L 34.2 38.8 L 36.2 38 Z" fill="#FFFDF6"/>
    <circle cx="45" cy="27" r="1" fill="#FFFDF6"/>
    <circle cx="33" cy="8" r="0.8" fill="#FFFDF6"/>
  </svg>

  <canvas id="canvas" width="1024" height="1024" style="display:none"></canvas>

  <button onclick="download()" style="padding:12px 28px;font-size:16px;cursor:pointer;border-radius:8px;border:none;background:#FFFDF6;font-weight:700">
    PNG 다운로드 (1024x1024)
  </button>

  <script>
    function download() {
      const svg = document.getElementById('logo');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const data = new XMLSerializer().serializeToString(svg);
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, 1024, 1024);
        const a = document.createElement('a');
        a.download = 'icon.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data)));
    }
  </script>
</body>
</html>
